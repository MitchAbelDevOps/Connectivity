name: "infra-appgw-mitchtest-workflow"

on:
  workflow_call:
    inputs:
      environment:
        description: "The target github environment for deployment (dev, test, stg, pwe, prd)"
        required: true
        type: string
      root_directory:
        description: "Root directory where Terraform config is located"
        required: false
        default: "rg-networking-mitchtest/Infrastructure"
        type: string
      sub_directory:
        description: "Sub-directory containing resource Terraform files"
        required: false
        default: "rg-networking-mitchtest/Infrastructure/ApplicationGateway"
        type: string
      terraform_state_prefix:
        description: "Prefix for the tfstate blob to create for this resource"
        required: false
        default: "appgw-mitchtest"
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: "The target github environment for deployment (dev, test, stg, pwe, prd)"
        required: true
        type: string
      root_directory:
        description: "Root directory where Terraform config is located"
        required: false
        default: "rg-networking-mitchtest/Infrastructure"
        type: string
      sub_directory:
        description: "Sub-directory containing resource Terraform files"
        required: false
        default: "rg-networking-mitchtest/Infrastructure/ApplicationGateway"
        type: string
      terraform_state_prefix:
        description: "Prefix for the tfstate blob to create for this resource"
        required: false
        default: "appgw-mitchtest"
        type: string

jobs:
  # Dev Environment
  dev:
    if: ${{ inputs.environment == 'dev' }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: MitchAbelDevOps/DevOps/.github/workflows/deploy-resource.yaml@main
    with:
      environment: "dev"
      root_directory: ${{ inputs.root_directory }}
      sub_directory: ${{ inputs.sub_directory }}
      terraform_state_filename: "${{ inputs.terraform_state_prefix }}.${{ inputs.environment }}.tfstate"
      runner: "self-hosted-npe"
    secrets: inherit

  # Test Environment
  test:
    if: ${{ inputs.environment == 'test' }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: MitchAbelDevOps/DevOps/.github/workflows/deploy-resource.yaml@main
    with:
      environment: "test"
      root_directory: ${{ inputs.root_directory }}
      sub_directory: ${{ inputs.sub_directory }}
      terraform_state_filename: "${{ inputs.terraform_state_prefix }}.${{ inputs.environment }}.tfstate"
      runner: "self-hosted-npe"
    secrets: inherit

  # Staging Environment
  stg:
    if: ${{ inputs.environment == 'stg' }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: MitchAbelDevOps/DevOps/.github/workflows/deploy-resource.yaml@main
    with:
      environment: "stg"
      root_directory: ${{ inputs.root_directory }}
      sub_directory: ${{ inputs.sub_directory }}
      terraform_state_filename: "${{ inputs.terraform_state_prefix }}.${{ inputs.environment }}.tfstate"
      runner: "self-hosted-ppe"
    secrets: inherit

  # Production Warranty Environment
  pwe:
    if: ${{ inputs.environment == 'pwe' }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: MitchAbelDevOps/DevOps/.github/workflows/deploy-resource.yaml@main
    with:
      environment: "pwe"
      root_directory: ${{ inputs.root_directory }}
      sub_directory: ${{ inputs.sub_directory }}
      terraform_state_filename: "${{ inputs.terraform_state_prefix }}.${{ inputs.environment }}.tfstate"
      runner: "self-hosted-ppe"
    secrets: inherit

  # Prod Environment
  prod:
    if: ${{ inputs.environment == 'prd' }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: MitchAbelDevOps/DevOps/.github/workflows/deploy-resource.yaml@main
    with:
      environment: "prd"
      root_directory: ${{ inputs.root_directory }}
      sub_directory: ${{ inputs.sub_directory }}
      terraform_state_filename: "${{ inputs.terraform_state_prefix }}.${{ inputs.environment }}.tfstate"
      runner: "self-hosted-prd"
    secrets: inherit
