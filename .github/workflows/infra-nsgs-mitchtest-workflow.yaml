name: "infra-nsgs-mitchtest-workflow"

on:
  workflow_call:
    inputs:
      environment:
        description: "The target environment for deployment (dev, stg, prd)"
        required: true
        type: string
      root_directory:
        description: "Root directory where Terraform config is located"
        required: false
        default: "rg-networking-mitchtest/Infrastructure"
        type: string
      sub_directory:
        description: "Sub-directory containing resource Terraform files"
        required: false
        default: "rg-networking-mitchtest/Infrastructure/NetworkSecurityGroup"
        type: string
      terraform_state_prefix:
        description: "Prefix for the tfstate blob to create for this resource"
        required: false
        default: "nsgs-mitchtest"
        type: string
      runner:
        description: "Type of runner to use for deployment. Defaults to GitHub hosted Linux"
        required: false
        type: string
        default: "ubuntu-latest"
  workflow_dispatch:
    inputs:
      environment:
        description: "The target environment for deployment (dev, stg, prd)"
        required: true
        type: string
      root_directory:
        description: "Root directory where Terraform config is located"
        required: false
        default: "rg-networking-mitchtest/Infrastructure"
        type: string
      sub_directory:
        description: "Sub-directory containing resource Terraform files"
        required: false
        default: "rg-networking-mitchtest/Infrastructure/NetworkSecurityGroup"
        type: string
      terraform_state_prefix:
        description: "Prefix for the tfstate blob to create for this resource"
        required: false
        default: "nsgs-mitchtest"
        type: string
      runner:
        description: "Type of runner to use for deployment. Defaults to GitHub hosted Linux"
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  # Dev Environment
  nonprod:
    if: ${{ inputs.environment == 'dev' }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: MitchAbelDevOps/DevOps/.github/workflows/deploy-resource.yaml@main
    with:
      environment: "dev"
      root_directory: ${{ inputs.root_directory }}
      sub_directory: ${{ inputs.sub_directory }}
      terraform_state_filename: "${{ inputs.terraform_state_prefix }}.npe.tfstate"
      runner: ${{  inputs.runner }}
    secrets: inherit

  # Staging Environment
  preprod:
    if: ${{ inputs.environment == 'stg' }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: MitchAbelDevOps/DevOps/.github/workflows/deploy-resource.yaml@main
    with:
      environment: "stg"
      root_directory: ${{ inputs.root_directory }}
      sub_directory: ${{ inputs.sub_directory }}
      terraform_state_filename: "${{ inputs.terraform_state_prefix }}.ppe.tfstate"
      runner: ${{  inputs.runner }}
    secrets: inherit

  # Prod Environment
  prod:
    if: ${{ inputs.environment == 'prd' }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: MitchAbelDevOps/DevOps/.github/workflows/deploy-resource.yaml@main
    with:
      environment: "prd"
      root_directory: ${{ inputs.root_directory }}
      sub_directory: ${{ inputs.sub_directory }}
      terraform_state_filename: "${{ inputs.terraform_state_prefix }}.prd.tfstate"
      runner: ${{  inputs.runner }}
    secrets: inherit
